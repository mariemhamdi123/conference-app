<section class="friends">
  <div class="icone">👥</div>

  <div class="contenu">
    <h2>Liste des amis</h2>

    <div class="inputs">
      @for (item of friendsList; track item) {
        <input type="text" [(ngModel)]="item.name" />
      }
    </div>

    <ul>
      @for (item of friendsList; track item) {
        <li>{{ item.name }}</li>
      }
    </ul>
  </div>
</section>
